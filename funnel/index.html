let current = "service";

function el(tag, cls, text) { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }

function render(key) {
  const o = OFFERS[key] || OFFERS.service; current = OFFERS[key] ? key : "service";
  document.querySelectorAll("#switch button").forEach(b => b.setAttribute("aria-pressed", b.dataset.k === current));

  $("ctaTop").textContent = o.cta; $("ctaSticky").textContent = o.cta; $("submit").textContent = o.submit;

  $("benefits").replaceChildren(...o.benefits.map(([b, t]) => { const li = el("li"); const d = el("div"); d.append(el("b", "", b), document.createTextNode(": " + t)); li.append(d); return li; }));
  $("steps").replaceChildren(...o.steps.map(([h, t]) => { const s = el("div", "step"); const d = el("div"); d.append(el("h3", "", h), el("p", "muted", t)); s.append(d); return s; }));

  $("brandLine").textContent = "© " + new Date().getFullYear() + " " + CONFIG.BRAND + " · Contact: " + CONFIG.CONTACT;

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  const data = Object.fromEntries(new FormData(e.target));
  const missing = OFFERS[current].fields.find(([id]) => !String(data[id] || "").trim());
  if (missing) { $("err").textContent = "Please fill in " + missing[1].toLowerCase() + "."; return; }
  if (data.email && !/^\S+@\S+\.\S+$/.test(data.email)) { $("err").textContent = "That email looks incomplete. Check for a typo."; return; }
  if (data.phone && data.phone.replace(/\D/g, "").length < 10) { $("err").textContent = "Enter a 10-digit phone number."; return; }
  const lead = { ...data, offer: current, submittedAt: new Date().toISOString() };
  try { const all = JSON.parse(localStorage.getItem("leads") || "[]"); all.push(lead); localStorage.setItem("leads", JSON.stringify(all)); } catch (_) {}
  if (CONFIG.WEBHOOK_URL) { try { await fetch(CONFIG.WEBHOOK_URL, { method: "POST", body: JSON.stringify(lead) }); } catch (_) {} }
  const o = OFFERS[current];
  $("thanksBody").textContent = o.thanksBody;
  if (o.afterLink) { const a = el("a", "", "open the trial page"); a.href = o.afterLink; a.target = "_blank"; a.rel = "noopener sponsored"; $("thanksBody").append(a, document.createTextNode(".")); }
  $("form").hidden = true; $("thanks").hidden = false;
});

if (CONFIG.SHOW_SWITCHER) {
  Object.entries(OFFERS).forEach(([k, o]) => { const b = el("button", "", o.tab); b.type = "button"; b.dataset.k = k; b.onclick = () => { history.replaceState(null, "", "#" + k); render(k); }; $("switch").append(b); });
} else { $("switch").hidden = true; }

render((location.hash || "").replace("#", "") || "service");
window.addEventListener("hashchange", () => { const k = location.hash.slice(1); if (OFFERS[k]) render(k); });
</script>
</body></html>
